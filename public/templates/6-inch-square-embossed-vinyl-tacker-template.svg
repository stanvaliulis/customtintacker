<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 414 414"
     width="414" height="414"
     style="background:#ffffff">

  <!-- Template Info -->
  <!-- Product: 6-inch-square-embossed-vinyl-tacker -->
  <!-- Shape: Square -->
  <!-- Size: 6" x 6" -->
  <!-- Bleed: 0.125" on all sides -->
  <!-- Safe Area: 0.25" from trim edge -->

  <defs>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; }
      .trim-line { fill: none; stroke: #000000; stroke-width: 1.5; }
      .bleed-line { fill: none; stroke: #FF0000; stroke-width: 1; stroke-dasharray: 6 3; }
      .safe-line { fill: none; stroke: #00AA00; stroke-width: 1; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <!-- Light gray background for bleed area -->
  <rect x="0" y="0" width="414" height="414" fill="#f5f5f5" />

  <!-- White fill for trim area -->
  <rect x="9" y="9" width="396" height="396" rx="7.92" fill="#ffffff" />

  <!-- Bleed line (red dashed) -->
  <rect x="0" y="0" width="414" height="414" rx="7.92" class="bleed-line" />

  <!-- Trim / Cut line (solid black) -->
  <rect x="9" y="9" width="396" height="396" rx="7.92" class="trim-line" />

  <!-- Safe area line (green dashed) -->
  <rect x="27" y="27" width="360" height="360" rx="7.92" class="safe-line" />

  <!-- Center text -->
  <text x="207" y="187" text-anchor="middle" class="label"
        font-size="18" font-weight="bold" fill="#888888">
    YOUR ARTWORK HERE
  </text>
  <text x="207" y="213" text-anchor="middle" class="label"
        font-size="11" fill="#aaaaaa">
    6" x 6" Square Tin Tacker
  </text>
  <text x="207" y="231" text-anchor="middle" class="label"
        font-size="9" fill="#bbbbbb">
    customtintackers.com
  </text>

  <!-- Dimension labels -->
  <!-- Width -->
  <line x1="9" y1="-6" x2="405" y2="-6"
        stroke="#666666" stroke-width="0.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="207" y="-11" text-anchor="middle" class="label"
        font-size="10" fill="#666666">
    5.5&quot;
  </text>

  <!-- Height -->
  <line x1="420" y1="9" x2="420" y2="405"
        stroke="#666666" stroke-width="0.5" />
  <text x="425" y="211" text-anchor="start" class="label"
        font-size="10" fill="#666666" transform="rotate(90, 425, 211)">
    5.5&quot;
  </text>

  <!-- Legend -->
  <g transform="translate(17, 355)">
    <line x1="0" y1="0" x2="25" y2="0" class="bleed-line" />
    <text x="30" y="4" class="label" font-size="8" fill="#FF0000">Bleed (0.125&quot;)</text>

    <line x1="0" y1="14" x2="25" y2="14" class="trim-line" />
    <text x="30" y="18" class="label" font-size="8" fill="#000000">Trim / Cut Line</text>

    <line x1="0" y1="28" x2="25" y2="28" class="safe-line" />
    <text x="30" y="32" class="label" font-size="8" fill="#00AA00">Safe Area (0.25&quot;)</text>
  </g>

</svg>